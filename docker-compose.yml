# All configurable values are read from the single root ".env" file
# (Docker Compose loads it automatically). Defaults below let the stack run
# even when no .env exists — so `docker compose up -d --build` just works.
services:
  mongo:
    image: mongo:7
    container_name: invoice-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -ec
      - |
        if ! mongosh --host mongo --quiet --eval 'try { rs.conf(); quit(0); } catch (e) { quit(1); }' >/dev/null 2>&1; then
          mongosh --host mongo --quiet --eval 'rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo:27017"}]})'
        fi
        until mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

  mailpit:
    image: axllent/mailpit:latest
    container_name: invoice-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoice-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      # Docker always uses the bundled MongoDB service (ignores DATABASE in .env)
      DATABASE: "mongodb://mongo:27017/invoice?replicaSet=rs0"
      PORT: "8000"
      NODE_ENV: "production"
      JWT_SECRET: "${JWT_SECRET:-change_this_jwt_secret_in_production}"
      # Public URLs (links in emails, file URLs)
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      PUBLIC_SERVER_FILE: "${VITE_BACKEND_SERVER:-http://localhost:8000/}"
      # Email is captured locally by Mailpit and is never delivered externally.
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-noreply@invoicecrm.test}"
      # AI (optional)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/backend/src/public/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the build (browser talks to backend directly)
        VITE_BACKEND_SERVER: "${VITE_BACKEND_SERVER:-http://localhost:8000/}"
        VITE_FILE_BASE_URL: "${VITE_FILE_BASE_URL:-http://localhost:8000/}"
    container_name: invoice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
  uploads-data:
